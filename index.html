<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>Apple Store Malaysia — Gemini Canvas</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone@7.28.4/babel.min.js"></script>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
        "lucide-react": "https://esm.sh/lucide-react@0.468.0?external=react"
      }
    }
  </script>

  <style>
    html, body, #root { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #fff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    #boot-screen { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; background: #fff; color: #171717; padding: 24px; }
    #boot-card { width: min(100%, 360px); text-align: center; }
    .boot-spinner { width: 28px; height: 28px; border: 3px solid #e5e5e5; border-top-color: #171717; border-radius: 50%; margin: 0 auto 18px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #boot-error { display: none; margin-top: 16px; color: #b91c1c; font-size: 13px; line-height: 1.5; }
    #boot-retry { display: none; margin: 16px auto 0; padding: 10px 16px; border-radius: 10px; background: #171717; color: white; font-size: 13px; font-weight: 600; }
    #update-banner { display: none; position: fixed; z-index: 99998; top: 12px; left: 50%; transform: translateX(-50%); width: min(calc(100% - 24px), 420px); padding: 10px 12px; border: 1px solid #e5e5e5; border-radius: 14px; background: rgba(255,255,255,.96); box-shadow: 0 8px 30px rgba(0,0,0,.12); color: #171717; align-items: center; justify-content: space-between; gap: 12px; font: 12px/1.35 Inter, ui-sans-serif, system-ui, sans-serif; }
    #update-banner button { flex: none; border-radius: 9px; padding: 8px 11px; background: #171717; color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <div id="root"></div>

  <div id="boot-screen">
    <div id="boot-card">
      <div class="boot-spinner" id="boot-spinner"></div>
      <div style="font-size:15px;font-weight:700">Memuat aplikasi</div>
      <div id="boot-message" style="margin-top:7px;color:#737373;font-size:12px">Mengambil versi terbaru dari GitHub…</div>
      <div id="boot-error"></div>
      <button id="boot-retry" type="button">Coba lagi</button>
    </div>
  </div>

  <div id="update-banner" role="status">
    <span>Versi baru tersedia dari GitHub.</span>
    <button id="apply-update" type="button">Terapkan update</button>
  </div>

  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import * as LucideReact from 'lucide-react';

    const SOURCE_URL = 'https://raw.githubusercontent.com/applestoree/gemini-canvas/refs/heads/main/App.jsx';
    const CACHE_KEY = 'gemini_canvas_app_source_v1';
    const rootElement = document.getElementById('root');
    const bootScreen = document.getElementById('boot-screen');
    const bootMessage = document.getElementById('boot-message');
    const bootError = document.getElementById('boot-error');
    const bootRetry = document.getElementById('boot-retry');
    const bootSpinner = document.getElementById('boot-spinner');
    const updateBanner = document.getElementById('update-banner');
    const applyUpdateButton = document.getElementById('apply-update');

    let activeHash = '';
    let pendingSource = '';
    let pendingHash = '';
    let appRoot = null;

    window.__GEMINI_CANVAS_REACT__ = React;
    window.__GEMINI_CANVAS_REACT_DOM__ = { createRoot };
    window.__GEMINI_CANVAS_LUCIDE__ = LucideReact;

    function setBootError(message) {
      bootSpinner.style.display = 'none';
      bootMessage.textContent = 'Aplikasi belum dapat dimuat.';
      bootError.textContent = message;
      bootError.style.display = 'block';
      bootRetry.style.display = 'inline-block';
    }

    async function hashText(value) {
      if (window.crypto?.subtle) {
        const bytes = new TextEncoder().encode(value);
        const digest = await crypto.subtle.digest('SHA-256', bytes);
        return [...new Uint8Array(digest)].map(x => x.toString(16).padStart(2, '0')).join('');
      }
      let hash = 2166136261;
      for (let i = 0; i < value.length; i++) {
        hash ^= value.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return String(hash >>> 0);
    }

    function extractImports(source) {
      const reactMatch = source.match(/import\s+React\s*,\s*\{([\s\S]*?)\}\s*from\s*['"]react['"]\s*;?/);
      const iconMatch = source.match(/import\s*\{([\s\S]*?)\}\s*from\s*['"]lucide-react['"]\s*;?/);
      if (!reactMatch || !iconMatch) {
        throw new Error('Struktur import App.jsx tidak dikenali. Pastikan React dan lucide-react masih menggunakan named import.');
      }

      const toBindings = value => value.split(',').map(item => item.trim()).filter(Boolean).map(item => {
        const parts = item.split(/\s+as\s+/);
        return parts.length === 2 ? parts[0] + ': ' + parts[1] : parts[0];
      }).join(', ');

      let code = source.replace(reactMatch[0], '').replace(iconMatch[0], '');
      if (/^\s*import\s/m.test(code)) {
        throw new Error('App.jsx memiliki import tambahan yang belum didukung oleh HTML loader.');
      }

      return {
        code,
        reactBindings: toBindings(reactMatch[1]),
        iconBindings: toBindings(iconMatch[1])
      };
    }

    async function renderSource(source) {
      if (!window.Babel) throw new Error('Babel compiler tidak berhasil dimuat.');

      const imports = extractImports(source);
      const compiled = Babel.transform(imports.code, {
        presets: [['react', { runtime: 'classic' }]],
        sourceType: 'script',
        comments: false
      }).code;

      const moduleSource = `
        const React = window.__GEMINI_CANVAS_REACT__;
        const ReactDOM = window.__GEMINI_CANVAS_REACT_DOM__;
        const LucideReact = window.__GEMINI_CANVAS_LUCIDE__;
        const { ${imports.reactBindings} } = React;
        const { ${imports.iconBindings} } = LucideReact;
        ${compiled}
        const rootElement = document.getElementById('root');
        if (window.__GEMINI_CANVAS_ROOT__) window.__GEMINI_CANVAS_ROOT__.unmount();
        window.__GEMINI_CANVAS_ROOT__ = ReactDOM.createRoot(rootElement);
        window.__GEMINI_CANVAS_ROOT__.render(React.createElement(App));
      `;

      const blobUrl = URL.createObjectURL(new Blob([moduleSource], { type: 'text/javascript' }));
      try {
        await import(blobUrl);
      } finally {
        URL.revokeObjectURL(blobUrl);
      }
    }

    async function fetchLatestSource() {
      const response = await fetch(SOURCE_URL + '?update=' + Date.now(), {
        method: 'GET',
        cache: 'no-store',
        headers: { 'Accept': 'text/plain' }
      });
      if (!response.ok) throw new Error('GitHub mengembalikan HTTP ' + response.status + '.');
      const source = await response.text();
      if (!source.trim() || !source.includes('function App')) {
        throw new Error('File App.jsx dari GitHub kosong atau formatnya tidak sesuai.');
      }
      return source;
    }

    async function startApplication() {
      bootRetry.style.display = 'none';
      bootError.style.display = 'none';
      bootSpinner.style.display = 'block';
      bootMessage.textContent = 'Mengambil versi terbaru dari GitHub…';

      try {
        let source;
        let loadedFromGitHub = true;
        try {
          source = await fetchLatestSource();
        } catch (networkError) {
          loadedFromGitHub = false;
          source = localStorage.getItem(CACHE_KEY);
          if (!source) throw networkError;
        }

        await renderSource(source);
        activeHash = await hashText(source);
        if (loadedFromGitHub) {
          try { localStorage.setItem(CACHE_KEY, source); } catch (_) {}
          bootMessage.textContent = 'Versi terbaru berhasil dimuat.';
        } else {
          bootMessage.textContent = 'Menggunakan salinan terakhir yang tersimpan.';
        }
        bootScreen.style.display = 'none';
      } catch (error) {
        setBootError(error?.message || 'Terjadi kesalahan saat memuat aplikasi.');
      }
    }

    async function checkForUpdate() {
      try {
        const source = await fetchLatestSource();
        const hash = await hashText(source);
        if (activeHash && hash !== activeHash) {
          pendingSource = source;
          pendingHash = hash;
          updateBanner.style.display = 'flex';
        }
      } catch (_) {
        // Keep the currently running application when GitHub is temporarily unavailable.
      }
    }

    applyUpdateButton.addEventListener('click', async () => {
      if (!pendingSource) return;
      applyUpdateButton.disabled = true;
      applyUpdateButton.textContent = 'Memuat…';
      try {
        await renderSource(pendingSource);
        activeHash = pendingHash;
        try { localStorage.setItem(CACHE_KEY, pendingSource); } catch (_) {}
        pendingSource = '';
        pendingHash = '';
        updateBanner.style.display = 'none';
      } catch (error) {
        applyUpdateButton.disabled = false;
        applyUpdateButton.textContent = 'Coba terapkan lagi';
        console.error('Gagal menerapkan update:', error);
      }
    });

    bootRetry.addEventListener('click', startApplication);

    await startApplication();
    window.setInterval(checkForUpdate, 90000);
  </script>
</body>
</html>

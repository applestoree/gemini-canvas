<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Generator</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-neutral-900 text-white flex flex-col items-center justify-center p-4">

  <div class="max-w-md w-full bg-neutral-800 p-6 rounded-2xl shadow-xl border border-neutral-700">
    <h1 class="text-xl font-bold mb-4 flex items-center gap-2">
      <i data-lucide="sparkles" class="text-yellow-400"></i> AI Image Generator
    </h1>

    <form id="imageForm" class="space-y-4">
      <div>
        <label for="promptInput" class="block text-sm text-neutral-400 mb-1">Masukkan Prompt:</label>
        <textarea
          id="promptInput"
          rows="3"
          placeholder="Contoh: Kucing astronot di luar angkasa..."
          class="w-full bg-neutral-900 border border-neutral-700 rounded-xl p-3 text-sm focus:outline-none focus:border-yellow-400"
          required
        ></textarea>
      </div>

      <button
        type="submit"
        id="submitBtn"
        class="w-full py-3 bg-yellow-500 hover:bg-yellow-400 text-neutral-950 font-semibold rounded-xl flex items-center justify-center gap-2 transition disabled:opacity-50 cursor-pointer"
      >
        <i id="btnIcon" data-lucide="sparkles" class="w-5 h-5"></i>
        <span id="btnText">Buat Gambar</span>
      </button>
    </form>

    <!-- Pesan Error -->
    <p id="errorMsg" class="hidden text-red-400 text-sm mt-4 text-center"></p>

    <!-- Hasil Gambar -->
    <div id="resultContainer" class="hidden mt-6 flex flex-col items-center space-y-3">
      <img id="resultImage" src="" alt="" class="w-full rounded-xl shadow-lg border border-neutral-700" />
      <a
        id="downloadBtn"
        href=""
        download="image.png"
        class="flex items-center gap-2 bg-neutral-700 hover:bg-neutral-600 px-4 py-2 rounded-xl text-sm font-medium transition"
      >
        <i data-lucide="download" class="w-4 h-4"></i> Download Gambar
      </a>
    </div>
  </div>

  <script>
    // Inisialisasi ikon Lucide pertama kali
    lucide.createIcons();

    const form = document.getElementById('imageForm');
    const promptInput = document.getElementById('promptInput');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const errorMsg = document.getElementById('errorMsg');
    const resultContainer = document.getElementById('resultContainer');
    const resultImage = document.getElementById('resultImage');
    const downloadBtn = document.getElementById('downloadBtn');

    // Fungsi untuk mengatur tampilan state loading
    function setLoadingState(isLoading) {
      submitBtn.disabled = isLoading;
      const currentIcon = document.getElementById('btnIcon');

      if (isLoading) {
        currentIcon.setAttribute('data-lucide', 'loader-2');
        currentIcon.classList.add('animate-spin');
        btnText.textContent = 'Membuat...';
      } else {
        currentIcon.setAttribute('data-lucide', 'sparkles');
        currentIcon.classList.remove('animate-spin');
        btnText.textContent = 'Buat Gambar';
      }
      // Render ulang ikon yang berubah
      lucide.createIcons();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      // Reset UI
      setLoadingState(true);
      errorMsg.classList.add('hidden');
      errorMsg.textContent = '';
      resultContainer.classList.add('hidden');

      try {
        const payload = {
          contents: [{ role: 'user', parts: [{ text: prompt }] }],
          generationConfig: { responseModalities: ['IMAGE'] },
        };

        const apiKey = ''; // Masukkan API Key Gemini Anda di sini
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;

        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!res.ok) throw new Error('Gagal menghasilkan gambar');

        const data = await res.json();
        const part = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

        if (!part) throw new Error('Tidak ada data gambar yang dikembalikan');

        const imageUrl = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;

        // Tampilkan gambar dan tombol download
        resultImage.src = imageUrl;
        resultImage.alt = prompt;
        downloadBtn.href = imageUrl;
        resultContainer.classList.remove('hidden');

      } catch (err) {
        errorMsg.textContent = err.message || 'Terjadi kesalahan';
        errorMsg.classList.remove('hidden');
      } finally {
        setLoadingState(false);
      }
    });
  </script>
</body>
</html>

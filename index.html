<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Generator - Apple Store Malaysia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-white text-neutral-900 flex flex-col items-center justify-center p-4">
  <main class="max-w-md w-full bg-white p-6 rounded-2xl shadow-sm border border-neutral-200">
    <h1 class="text-xl font-bold mb-2 flex items-center gap-2">
      <i data-lucide="sparkles" class="text-yellow-400"></i> AI Image Generator
    </h1>
    <p class="text-sm text-neutral-500 mb-5">Pilih kategori konten dan subkategori sebelum membuat visual.</p>

    <form id="imageForm" class="space-y-4">
      <div>
        <label for="categorySelect" class="block text-sm font-medium text-neutral-700 mb-1">Kategori Konten</label>
        <select id="categorySelect" required class="w-full bg-neutral-50 text-neutral-900 border border-neutral-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-neutral-300 focus:border-neutral-400">
          <option value="">Pilih kategori konten</option>
          <option value="product">Product Content</option>
          <option value="education">Education Content</option>
        </select>
      </div>

      <div id="objectivePanel" class="hidden rounded-xl border border-neutral-200 bg-neutral-50 p-3">
        <p class="text-xs uppercase tracking-wide text-neutral-500 mb-1">Objective</p>
        <p id="objectiveText" class="text-sm text-neutral-700"></p>
      </div>

      <div>
        <label for="subcategorySelect" class="block text-sm text-neutral-300 mb-1">Subkategori</label>
        <select id="subcategorySelect" required disabled class="w-full bg-neutral-50 text-neutral-900 border border-neutral-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-neutral-300 focus:border-neutral-400 disabled:opacity-50">
          <option value="">Pilih kategori terlebih dahulu</option>
        </select>
      </div>

      <div>
        <label for="ideaInput" class="block text-sm font-medium text-neutral-700 mb-1">Ide atau Informasi Tambahan <span class="font-normal text-neutral-400">(opsional)</span></label>
        <textarea id="ideaInput" rows="3" placeholder="Contoh: iPhone 17 Pro Max dengan fokus pada desain titanium dan kemampuan kamera..." class="w-full bg-neutral-50 text-neutral-900 border border-neutral-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-neutral-300 focus:border-neutral-400 placeholder:text-neutral-400"></textarea>
        <p class="text-xs text-neutral-400 mt-1">AI akan mengembangkan ide ini berdasarkan kategori dan subkategori yang dipilih.</p>
      </div>

      <button type="button" id="generatePromptBtn" class="w-full py-3 bg-white hover:bg-neutral-50 text-neutral-900 border border-neutral-300 font-semibold rounded-xl flex items-center justify-center gap-2 transition disabled:opacity-50 cursor-pointer">
        <i id="promptBtnIcon" data-lucide="bot" class="w-5 h-5"></i>
        <span id="promptBtnText">Generate Detail Prompt dengan AI</span>
      </button>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label for="promptInput" class="block text-sm font-medium text-neutral-700">Detail Prompt Visual</label>
          <span id="promptStatus" class="text-xs text-neutral-400">Bisa diedit</span>
        </div>
        <textarea id="promptInput" rows="9" placeholder="Klik Generate Detail Prompt dengan AI, atau tulis prompt secara manual..." class="w-full bg-neutral-50 text-neutral-900 border border-neutral-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-neutral-300 focus:border-neutral-400 placeholder:text-neutral-400" required></textarea>
        <p class="text-xs text-neutral-400 mt-1">Periksa dan edit hasil prompt sebelum membuat gambar.</p>
      </div>

      <button type="submit" id="submitBtn" class="w-full py-3 bg-neutral-900 hover:bg-neutral-800 text-white font-semibold rounded-xl flex items-center justify-center gap-2 transition disabled:opacity-50 cursor-pointer">
        <i id="btnIcon" data-lucide="sparkles" class="w-5 h-5"></i>
        <span id="btnText">Buat Gambar</span>
      </button>
    </form>

    <p id="errorMsg" class="hidden text-red-600 text-sm mt-4 text-center"></p>

    <div id="resultContainer" class="hidden mt-6 flex flex-col items-center space-y-3">
      <img id="resultImage" src="" alt="" class="w-full rounded-xl shadow-sm border border-neutral-200" />
      <a id="downloadBtn" href="" download="image.png" class="flex items-center gap-2 bg-neutral-100 hover:bg-neutral-200 text-neutral-800 border border-neutral-200 px-4 py-2 rounded-xl text-sm font-medium transition">
        <i data-lucide="download" class="w-4 h-4"></i> Download Gambar
      </a>
    </div>
  </main>

  <script>
    lucide.createIcons();

    const categories = {
      product: {
        name: 'Product Content',
        objective: 'Memperkenalkan produk Apple dan meningkatkan product awareness.',
        subcategories: [
          'New Product Showcase',
          'Product Features & Highlights',
          'Product Launch',
          'Product Comparison',
          'Product in Detail',
          'Best-Selling Products',
          'Apple Ecosystem Showcase',
          'Product Recommendation'
        ]
      },
      education: {
        name: 'Education Content',
        objective: 'Memberikan edukasi kepada audiens mengenai fitur, fungsi, dan manfaat produk Apple.',
        subcategories: [
          'Tips & Tricks',
          'How-to Tutorials',
          'Hidden Features',
          'Product Knowledge',
          'iPhone Photography Tips',
          'Productivity Tips',
          'Apple Ecosystem Tips',
          'Frequently Asked Questions (FAQ)'
        ]
      }
    };

    const form = document.getElementById('imageForm');
    const categorySelect = document.getElementById('categorySelect');
    const subcategorySelect = document.getElementById('subcategorySelect');
    const objectivePanel = document.getElementById('objectivePanel');
    const objectiveText = document.getElementById('objectiveText');
    const ideaInput = document.getElementById('ideaInput');
    const promptInput = document.getElementById('promptInput');
    const generatePromptBtn = document.getElementById('generatePromptBtn');
    const promptBtnText = document.getElementById('promptBtnText');
    const promptStatus = document.getElementById('promptStatus');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const errorMsg = document.getElementById('errorMsg');
    const resultContainer = document.getElementById('resultContainer');
    const resultImage = document.getElementById('resultImage');
    const downloadBtn = document.getElementById('downloadBtn');

    categorySelect.addEventListener('change', () => {
      const selected = categories[categorySelect.value];
      subcategorySelect.innerHTML = '';

      if (!selected) {
        objectivePanel.classList.add('hidden');
        subcategorySelect.disabled = true;
        subcategorySelect.add(new Option('Pilih kategori terlebih dahulu', ''));
        return;
      }

      objectiveText.textContent = selected.objective;
      objectivePanel.classList.remove('hidden');
      subcategorySelect.disabled = false;
      subcategorySelect.add(new Option('Pilih subkategori', ''));
      selected.subcategories.forEach(item => subcategorySelect.add(new Option(item, item)));
    });

    function getSelectedContent() {
      const category = categories[categorySelect.value];
      const subcategory = subcategorySelect.value;
      if (!category || !subcategory) {
        throw new Error('Pilih kategori dan subkategori terlebih dahulu.');
      }
      return { category, subcategory };
    }

    function setPromptLoadingState(isLoading) {
      generatePromptBtn.disabled = isLoading;
      promptBtnText.textContent = isLoading ? 'AI sedang menyusun prompt...' : 'Generate Detail Prompt dengan AI';
      const icon = document.getElementById('promptBtnIcon');
      icon.setAttribute('data-lucide', isLoading ? 'loader-2' : 'bot');
      icon.classList.toggle('animate-spin', isLoading);
      lucide.createIcons();
    }

    generatePromptBtn.addEventListener('click', async () => {
      errorMsg.classList.add('hidden');
      errorMsg.textContent = '';

      let selected;
      try {
        selected = getSelectedContent();
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
        return;
      }

      setPromptLoadingState(true);
      promptStatus.textContent = 'Sedang dibuat...';

      try {
        const apiKey = ''; // Masukkan API Key Gemini Anda di sini
        if (!apiKey) {
          throw new Error('API Key Gemini belum dikonfigurasi. Isi apiKey di dalam script sebelum menggunakan AI Agent.');
        }

        const idea = ideaInput.value.trim() || 'Develop a strong visual concept based on the selected category and subcategory.';
        const agentInstruction = [
          'You are an expert Apple product advertising art director and visual prompt engineer.',
          'Create one production-ready image-generation prompt based on the supplied content category, objective, subcategory, and user idea.',
          'Write the final image prompt in clear, detailed English for an image generation model. Do not add commentary, explanations, markdown fences, or multiple alternatives.',
          'Use these exact sections in the final prompt: SUBJECT; ACTION / CONCEPT; ENVIRONMENT; COMPOSITION; VISUAL STYLE; LIGHTING; CAMERA & QUALITY; COLOR & MOOD; DETAILS; NEGATIVE CONSTRAINTS.',
          'Always apply this visual direction: pure clean white seamless studio background; minimalist, elegant, premium Apple-style aesthetic; professional soft studio lighting; subtle realistic shadows; balanced composition with generous negative space.',
          'Avoid busy backgrounds, clutter, unnecessary props, distracting textures, patterns, gradients, and excessive decorations.',
          'For Product Content, make the Apple product the clear hero subject and preserve its recognizable design. Do not invent product specifications, logos, ports, colors, or features that were not supplied.',
          'For Education Content, communicate the selected educational topic clearly and accurately. Keep the visual focused on the relevant Apple product or educational subject. If text is essential, keep it concise, correctly spelled, and legible; do not fabricate technical facts.',
          'Respect the user idea and selected subcategory. Improve visual specificity and composition without changing the intended message.',
          'Return only the completed image prompt.'
        ].join(' ');

        const requestText = [
          agentInstruction,
          '',
          'CONTENT CATEGORY: ' + selected.category.name,
          'CONTENT OBJECTIVE: ' + selected.category.objective,
          'CONTENT SUBCATEGORY: ' + selected.subcategory,
          'USER IDEA / ADDITIONAL INFORMATION: ' + idea
        ].join('\n');

        const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(apiKey), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: 'user', parts: [{ text: requestText }] }],
            generationConfig: { temperature: 0.7, maxOutputTokens: 1800 }
          })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData?.error?.message || 'AI gagal menyusun Detail Prompt Visual.');
        }

        const data = await response.json();
        const generatedPrompt = data?.candidates?.[0]?.content?.parts
          ?.map(part => part.text || '')
          .join('\n')
          .trim();

        if (!generatedPrompt) throw new Error('AI tidak mengembalikan Detail Prompt Visual.');

        promptInput.value = generatedPrompt;
        promptStatus.textContent = 'Dibuat oleh AI · Bisa diedit';
      } catch (err) {
        promptStatus.textContent = 'Belum dibuat';
        errorMsg.textContent = err.message || 'Terjadi kesalahan saat membuat prompt.';
        errorMsg.classList.remove('hidden');
      } finally {
        setPromptLoadingState(false);
      }
    });

    function setLoadingState(isLoading) {
      submitBtn.disabled = isLoading;
      const currentIcon = document.getElementById('btnIcon');

      if (isLoading) {
        currentIcon.setAttribute('data-lucide', 'loader-2');
        currentIcon.classList.add('animate-spin');
        btnText.textContent = 'Membuat...';
      } else {
        currentIcon.setAttribute('data-lucide', 'sparkles');
        currentIcon.classList.remove('animate-spin');
        btnText.textContent = 'Buat Gambar';
      }
      lucide.createIcons();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      let selected;
      try {
        selected = getSelectedContent();
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.remove('hidden');
        return;
      }
      const { category, subcategory } = selected;
      const userPrompt = promptInput.value.trim();

      if (!userPrompt) {
        errorMsg.textContent = 'Generate atau isi Detail Prompt Visual terlebih dahulu.';
        errorMsg.classList.remove('hidden');
        return;
      }

      const visualDirection = [
        'BACKGROUND: Use a pure, clean white seamless studio background.',
        'VISUAL STYLE: Minimalist, elegant, premium Apple-style advertising aesthetic.',
        'LIGHTING: Professional soft studio lighting with subtle, realistic shadows.',
        'COMPOSITION: Clean, balanced composition with generous negative space. Keep the relevant Apple product or educational subject as the clear main focus.',
        'AVOID: Busy or colored backgrounds, clutter, unnecessary props, distracting textures, patterns, gradients, and excessive decorations.',
        'IMPORTANT: Apply this visual direction consistently while preserving the specific subject, information, and creative intent in the user visual brief.'
      ].join('\n');

      const prompt = [
        'Content Category: ' + category.name,
        'Content Objective: ' + category.objective,
        'Content Subcategory: ' + subcategory,
        'Visual Brief: ' + userPrompt,
        'Mandatory Visual Direction:',
        visualDirection
      ].join('\n');

      setLoadingState(true);
      errorMsg.classList.add('hidden');
      errorMsg.textContent = '';
      resultContainer.classList.add('hidden');

      try {
        const payload = {
          contents: [{ role: 'user', parts: [{ text: prompt }] }],
          generationConfig: { responseModalities: ['IMAGE'] }
        };

        const apiKey = ''; // Masukkan API Key Gemini Anda di sini
        if (!apiKey) throw new Error('API Key Gemini belum dikonfigurasi. Isi apiKey di dalam script sebelum membuat gambar.');
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${encodeURIComponent(apiKey)}`;

        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const errorData = await res.json().catch(() => ({}));
          throw new Error(errorData?.error?.message || 'Gagal menghasilkan gambar');
        }

        const data = await res.json();
        const part = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);

        if (!part) throw new Error('Tidak ada data gambar yang dikembalikan');

        const imageUrl = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
        resultImage.src = imageUrl;
        resultImage.alt = category.name + ' - ' + subcategory;
        downloadBtn.href = imageUrl;
        resultContainer.classList.remove('hidden');
      } catch (err) {
        errorMsg.textContent = err.message || 'Terjadi kesalahan';
        errorMsg.classList.remove('hidden');
      } finally {
        setLoadingState(false);
      }
    });
  </script>
</body>
</html>
